[package]
name = "wasm-spike"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pnpm-resolving-deps-resolver = { workspace = true }
# Feature unification only: turns on the wasm backend for both getrandom majors
# without touching any upstream crate.
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
